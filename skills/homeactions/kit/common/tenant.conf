# Tunables of the homeactions hooks for tenant {{tenant.name}}. Rendered from .homeactions/profile.json:
# re-render to change, never edit. Installed root-owned (0644) at {{derived.confFile}} and sourced by
# every hook run, maintenance.sh and the smoke scripts. Bash 3.2.
# Free-text profile values are read from quoted here-documents so no character in them can break this
# file. ("read" returns 1 at the end of a here-document; that is expected, hence "|| :".)
# shellcheck disable=SC2034
HA_TENANT="{{tenant.name}}"
HA_USER="{{tenant.user}}"
HA_GROUP="{{tenant.group}}"
HA_UID={{tenant.uid}}
HA_HOME="{{tenant.home}}"
HA_OS="{{host.os}}"
HA_CORES={{host.cores}}

# where things live
HA_ROOT_DIR="{{tenant.rootDir}}"
HA_HOOKS_DIR="{{derived.hooksDir}}"
HA_CONF_FILE="{{derived.confFile}}"
HA_RUNNER_DIR="{{derived.runnerDir}}"
HA_WORK_DIR="{{derived.runnerDir}}/_work"
HA_TMP_DIR="{{derived.tmpDir}}"
HA_CACHE_DIR="{{derived.cacheDir}}"
HA_OPT_DIR="{{derived.optDir}}"
HA_STATE_DIR="{{derived.stateDir}}"
HA_YIELD_STATE_DIR="{{derived.stateDir}}/yield"
HA_LOG_DIR="{{derived.logDir}}"
HA_DAEMON_LABEL="{{derived.daemonLabel}}"
HA_FIREWALL_LABEL="{{derived.firewallLabel}}"

# ports the tenant's jobs listen on: required free before every job
HA_PORTS="{{derived.portsSpace}}"

# isolation
HA_NETWORK_ISOLATION={{#if isolation.network}}1{{else}}0{{/if}}
HA_PROBES="{{derived.probesSpace}}"
read -r -d '' HA_FORBIDDEN_READ <<'HOMEACTIONS_EOF' || :
{{derived.forbiddenReadSpace}}
HOMEACTIONS_EOF
{{#if derived.isMacos}}
# Not `staff`: macOS computes every local account into it, so it cannot be avoided. What staff could read
# (another user's group-readable home) is closed by the deny-ACEs and checked by HA_FORBIDDEN_READ.
HA_FORBIDDEN_GROUPS="admin wheel _developer com.apple.access_ssh com.apple.access_screensharing"
{{else}}
HA_FORBIDDEN_GROUPS="sudo wheel admin adm docker lxd libvirt"
{{/if}}

# resources
HA_DISK_FLOOR_GB={{diskFloorGb}}
HA_HOME_MAX_GB={{maintenance.homeMaxGb}}
HA_DIAG_RETENTION_DAYS={{maintenance.diagRetentionDays}}
HA_NICE={{caps.nice}}
HA_OPEN_FILES={{caps.openFiles}}

# co-tenant yield (read-only, bounded, fail-open)
HA_COTENANT_MODE="{{cotenant.mode}}"
HA_YIELD_BUDGET_SECONDS={{cotenant.yieldBudgetSeconds}}
HA_YIELD_POLL_SECONDS={{cotenant.pollSeconds}}
HA_SWAP_YIELD_MB={{derived.swapYieldMb}}
HA_COTENANT_COMMAND_TIMEOUT=30
HA_COTENANT_MARKER_DIR=""
HA_COTENANT_PID_GLOB=""
HA_COTENANT_EPOCH_FILE=""
HA_COTENANT_EPOCH_BOUND=0
HA_COTENANT_COMMAND=""
HA_WORKER_PROBE_USER=""
HA_WORKER_PROBE_PATTERN=""
{{#if derived.cotenantMarkerDir}}
read -r -d '' HA_COTENANT_MARKER_DIR <<'HOMEACTIONS_EOF' || :
{{cotenant.markerDir}}
HOMEACTIONS_EOF
HA_COTENANT_PID_GLOB="{{derived.cotenantPidGlob}}"
HA_COTENANT_EPOCH_FILE="{{derived.cotenantEpochFile}}"
HA_COTENANT_EPOCH_BOUND={{derived.cotenantEpochBound}}
{{/if}}
{{#if derived.cotenantCommand}}
read -r -d '' HA_COTENANT_COMMAND <<'HOMEACTIONS_EOF' || :
{{cotenant.command}}
HOMEACTIONS_EOF
{{/if}}
{{#if derived.hasWorkerProbe}}
read -r -d '' HA_WORKER_PROBE_USER <<'HOMEACTIONS_EOF' || :
{{cotenant.workerProbe.user}}
HOMEACTIONS_EOF
read -r -d '' HA_WORKER_PROBE_PATTERN <<'HOMEACTIONS_EOF' || :
{{cotenant.workerProbe.pattern}}
HOMEACTIONS_EOF
{{/if}}

# per-job services (binaries built into the tenant home, or linked to the distro package)
HA_PG_BIN=""
HA_PG_PORT=""
HA_REDIS_BIN=""
HA_REDIS_PORT=""
{{#if derived.hasPostgres}}
HA_PG_BIN="{{derived.postgres.bin}}"
HA_PG_PORT={{derived.postgres.port}}
HA_PG_VERSION="{{derived.postgres.version}}"
{{/if}}
{{#if derived.hasRedis}}
HA_REDIS_BIN="{{derived.redis.bin}}"
HA_REDIS_PORT={{derived.redis.port}}
HA_REDIS_VERSION="{{derived.redis.version}}"
{{/if}}
