name: CI
# homeactions' own CI. GitHub-hosted runners ONLY: this repo is public, public repos get free hosted
# minutes, and a self-hosted runner must never serve a public repo (fork PRs would run code on it).
# tests/core/repo-ci.test.mjs fails if any workflow here names a self-hosted runner.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tools for the kit checks (shellcheck; nftables + systemd-analyze on Linux)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck nftables >/dev/null; else brew install shellcheck >/dev/null; fi
      - name: Unit, render, kit, audit, guard tests
        run: node --test tests/
      - name: Render every fixture and re-check determinism
        run: |
          for p in fixtures/profiles/*.json; do
            out="out/$(basename "$p" .json)"
            node skills/homeactions/kit/render.mjs --profile "$p" --out "$out"
            node skills/homeactions/kit/render.mjs --profile "$p" --out "$out" --check
          done
      - name: shellcheck the rendered kits and the repo scripts
        run: |
          find out skills hooks scripts -name '*.sh' -print0 | xargs -0 shellcheck -S warning
      - name: Linux beta artefacts parse (systemd units, nftables rules)
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob globstar
          for u in out/linux-beta/host/**/*.service; do systemd-analyze verify "$u" || { echo "systemd-analyze rejected $u"; exit 1; }; done
          for n in out/linux-beta/host/**/*.nft; do sudo nft -c -f "$n"; done

  hygiene:
    name: no private specifics, no secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Specifics scanner (names, private addresses, emails, token shapes)
        run: node scripts/scan-specifics.mjs
      - name: gitleaks (pinned, checksum-verified)
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  plugin:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate the plugin and marketplace manifests
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .
